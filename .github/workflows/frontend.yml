name: Frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm の版は package.json の packageManager から、Node の版は .nvmrc から読み、手元とそろえる
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run knip
      - run: pnpm run format:check

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      # Vitest はマークダウンの表を出せないので、文字の表をコードの枠で囲んでジョブの要約に出す
      - run: |
          {
            echo '```'
            cat frontend/coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
