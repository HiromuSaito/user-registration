name: Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    # services では env のコンテキストを使えないため、DB の値はジョブの env と services の両方に書く
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: user_registration
          POSTGRES_USER: user_registration
          POSTGRES_PASSWORD: ci-only-not-secret
        ports:
          - 5432:5432
        # 初回の準備の間は、TCP では受け付けない一時的なサーバーが動く。-h を付けずにソケットで確かめると、準備が終わる前に通ってしまう
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U user_registration -d user_registration"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: user_registration
      POSTGRES_USER: user_registration
      POSTGRES_PASSWORD: ci-only-not-secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
