name: API schema

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-schema:
    runs-on: ubuntu-latest
    # 設定を読み込むときに必須の値なので渡す。スキーマを作るのに DB にはつながないため、PostgreSQL は立てない
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: user_registration
      POSTGRES_USER: user_registration
      POSTGRES_PASSWORD: ci-only-not-secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # コミットしてあるスキーマが、Django のコードから作り直したものと同じか確かめる
      - run: uv run python manage.py spectacular --validate --file frontend/src/api/schema.yaml && git diff --exit-code frontend/src/api/schema.yaml
      # pnpm の版は package.json の packageManager から、Node の版は .nvmrc から読み、手元とそろえる
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # コミットしてある型が、コミットしてあるスキーマから作り直したものと同じか確かめる
      - run: pnpm run gen:types && git diff --exit-code frontend/src/api/schema.d.ts
