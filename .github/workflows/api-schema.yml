name: API schema

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm の版は package.json の packageManager から、Node の版は .nvmrc から読み、手元とそろえる
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # コミットしてある型が、コミットしてあるスキーマから作り直したものと同じか確かめる
      - run: pnpm run gen:types && git diff --exit-code frontend/src/api/schema.d.ts
