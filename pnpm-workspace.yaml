peerDependencyRules:
  allowedVersions:
    # openapi-typescript は TypeScript 5 を指定しているが、TypeScript 6 でも型を生成できる。
    # TypeScript 7 は openapi-typescript が使う API を持たないため、プロジェクトは 6 を使っている
    openapi-typescript>typescript: "6"

allowBuilds:
  # インストール時のスクリプトは Git のフックを登録するだけなので動かさず、README の手順で登録する
  lefthook: false
