[project]
name = "user-registration"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["E501"]