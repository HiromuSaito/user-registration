openapi: 3.0.3
info:
  title: user-registration API
  version: 1.0.0
paths:
  /api/prefs/:
    get:
      operationId: prefs_list
      tags:
      - prefs
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pref'
          description: ''
  /api/users/:
    post:
      operationId: users_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
        '400':
          description: 入力の誤り。項目ごとにエラーのメッセージの配列を返す
        '429':
          description: 登録の回数が多すぎる。Retry-After のヘッダーで、次に試せるまでの秒数を返す
components:
  schemas:
    Pref:
      type: object
      properties:
        code:
          type: integer
          maximum: 32767
          minimum: 0
        name:
          type: string
          maxLength: 4
      required:
      - code
      - name
    UserCreate:
      type: object
      properties:
        username:
          type: string
          title: ユーザー名
          pattern: ^[\w.@+-]+$
          maxLength: 150
          minLength: 3
        email:
          type: string
          title: メールアドレス
          maxLength: 254
        tel:
          type: string
          nullable: true
          title: 電話番号
          maxLength: 20
        pref:
          type: integer
          maximum: 32767
          minimum: 0
          title: 都道府県
      required:
      - email
      - pref
      - username
    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          title: ユーザー名
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          minLength: 1
          title: メールアドレス
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          title: パスワード
        tel:
          type: string
          nullable: true
          title: 電話番号
          maxLength: 20
        pref:
          type: integer
          maximum: 32767
          minimum: 0
          title: 都道府県
      required:
      - email
      - password
      - pref
      - username
