{% extends "base.html" %}

{% block title %}登録完了{% endblock %}

{% block content %}
  <h1 class="page-title">登録完了</h1>
  <div class="card complete">
    <div class="complete-icon" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <p class="complete-title">ユーザー登録が完了しました</p>
    <p class="complete-text">ご登録ありがとうございます。</p>
    <a class="button" href="{% url 'accounts:signup' %}">
      登録画面へ
      <span class="button-arrow" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12M10.5 4.5L15 9l-4.5 4.5"/></svg>
      </span>
    </a>
  </div>
{% endblock %}
