<div class="field">
  <label class="field-label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if not field.field.required %}<span class="field-optional">任意</span>{% endif %}
  </label>
  {{ field }}
  {{ field.errors }}
  {% if field.help_text %}
    <p class="field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>
  {% endif %}
</div>
